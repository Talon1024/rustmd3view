[package]
name = "rustmd3view"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8.3"
bytemuck = "1.13.0"
glow = "0.12.0"
glam = {version = "0.24.2", features=["bytemuck"]}
thiserror = "1.0.38"
anyhow = {version = "1.0.69", features=["backtrace"]}
egui = "0.22.0"
egui_glow = {version = "0.22.0", features=["winit"]}
image = "0.24.5"
once_cell = "1.17.1"
rayon = "1.6.1"
winit = "0.28.1"
raw-window-handle = "0.5.0"
rfd = "0.12.0"
instant = {version = "0.1.12", features = ["wasm-bindgen", "now"]}
futures = { version = "0.3.26", features = ["executor", "thread-pool", "async-await"] }
lazy_static = "1.4.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
glutin = "0.30.6"
glutin-winit = "0.3.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.84"
js-sys = "0.3.61"
web-sys = {version = "0.3.61", features = ["Response"]}
wasm-bindgen-futures = "0.4.34"
base64 = "0.21.0"
percent-encoding = "2.2.0"
console_error_panic_hook = "0.1.7"

[features]
default = []
extra_logging = ["log_drop_gl_resources"]
log_drop_gl_resources = []
make_animation_is_bugged = []
